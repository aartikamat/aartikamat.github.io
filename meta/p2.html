<meta name="DC.description" content="Introduces Post-Rejection Follow-up Sampling (PRFS), an observational methodology in which a separate tracking process samples the price and liquidity of each rejected token from the same live data path used by the rejecting system. The reported estimand is the observed post-rejection forward return; no causal claim about a hypothetical accepted trade is made. A corrected version is in preparation: in the deployed data the tracker sampled every 10 minutes and kept one record per token, so the follow-up schedule described in the posted versions was not realised.">
