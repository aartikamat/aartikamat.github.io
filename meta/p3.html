  "description": "Filter-gated algorithmic trading systems on decentralized exchanges reject the majority of candidate tokens they encounter, yet the in-production precision of these filter rules is rarely measured at scale. Prior work by the author introduced a post-rejection follow-up sampling methodology capable of producing the necessary data. The present paper reports the first at-scale precision audit produced by that methodology. Applied to a production multi-strategy trading fleet over a continuous fourteen-day observation window, the method yielded approximately 99,000 follow-up samples across approximately 2,400 unique rejection events spanning eight active filter rules. Under this refinement, every active filter in the live stack demonstrates a net-positive precision verdict with an aggregate save-to-miss ratio of approximately fifteen to one.",
