<meta name="DC.date" content="2026-04-12">
<meta name="DC.description" content="Reports a 15-day paper-traded deployment of an autonomous memecoin trading system on Solana decentralised exchanges (190 trades, 29 March to 12 April 2026). A test of three exploratorily selected weak entry hours against all other hours is directional and not confirmatory (Mann-Whitney p = 0.56), and removing the top three trades makes the cumulative return unprofitable. The contribution is measurement infrastructure, a deposited reproduction script, and three design lessons.">
